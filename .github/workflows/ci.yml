name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
      - name: Gates (including Go supervision fixtures)
        run: |
          gopath=$(go env GOPATH)
          export PATH="$gopath/bin:$PATH"
          if [ "$RUNNER_OS" = Linux ]; then
            BEACON_TEST_CHROME=$(command -v google-chrome)
            export BEACON_TEST_CHROME
          fi
          scripts/gates.sh
      - name: Build the installer’s binary in a temporary prefix (no service manager)
        run: scripts/install.sh --dry-run --prefix "$RUNNER_TEMP/beacon-install"
