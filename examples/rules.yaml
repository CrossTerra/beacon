# Starter rules for GitHub, Jira, Gmail, Calendar, Drive and Slack. Copy this file, replace YOUR_LOGIN with
# your GitHub login, and point the config's rules key at it. Check it with: beacon rules check
#
# First match wins. An item no rule matches is never sent. Bodies are not listed: comment, review and
# mail text, event descriptions, meeting notes and Slack messages stay on the machine unless you add
# body to a rule, and Google sources do not even read them until a rule lists body. `title`,
# `summary` and `subject` are the object's title, used as the thread title. The event title
# describes the change (Opened, Reviewed: approved, Assigned to a name, New message, Response
# needed, Mentioned) and is not one of these fields.
#
# person.identities should name you as the token's user, or own acts are recorded as Beacon's:
#   github: github:user:<login>
#   jira: jira:account:<account id>
#   gmail, calendar, drive: email:<your address>
#   slack: slack:user:<your user id>
#
# Gmail, Calendar and Drive subjects are personal (gmail:<handle>:thread:…), and so are Slack direct
# messages (slack:dm:<handle>:…). Before mode: send, ask Signal's admin to restrict gmail:*,
# calendar:*, drive:* and slack:dm:*, or every reader can read them. Beacon holds them until then.
#
# A Jira rule below records the event and does not ask. Add ask: me to ask yourself.

rules:
  # The person's own acts close their open asks (DEC-19, DEC-20). First, so an own comment is not
  # also an ask to themselves. Split by source so each rule names only that source's fields.
  - name: github-own-acts
    match: {source: github, own: true}
    tier: send
    fields: [title, url, repo, number, actor, references]
    state: [state, checks, review_decision]

  - name: jira-own-acts
    match: {source: jira, own: true}
    tier: send
    fields: [summary, url, key, project, actor, references]
    state: [status, assignee, due]

  # A review request that names the person.
  - name: github-review-requests
    match:
      source: github
      type: review_requested
      addressed: true
    tier: send
    ask: me
    priority: high
    fields: [title, url, repo, number, author, actor, references]
    state: [state, draft, head_sha, review_decision, mergeable, checks, requested_reviewers]

  # A comment that mentions the person.
  - name: github-comments-addressed
    match:
      source: github
      type: commented
      addressed: true
    tier: send
    ask: me
    priority: high
    fields: [title, url, repo, number, author, actor, references]
    state: [state, checks, review_decision]

  - name: jira-comments-addressed
    match:
      source: jira
      type: commented
      addressed: true
    tier: send
    ask: me
    priority: high
    fields: [summary, url, key, project, actor, references]
    state: [status, assignee]

  # Someone else's review of a pull request the person wrote.
  - name: github-reviews-on-own
    match:
      source: github
      type: reviewed
      fields:
        author: YOUR_LOGIN
    tier: send
    fields: [title, url, repo, number, author, review_state, actor, references]
    state: [state, draft, head_sha, review_decision, mergeable, checks]

  # A merge of a pull request the person wrote, by someone else. Their own merge is an own act.
  - name: github-merges-on-own
    match:
      source: github
      type: merged
      fields:
        author: YOUR_LOGIN
    tier: send
    fields: [title, url, repo, number, author, actor, references]
    state: [state, head_sha, checks]

  # A check-suite conclusion on the person's own open pull request.
  - name: github-checks-on-own
    match:
      source: github
      type: checks_changed
      fields:
        author: YOUR_LOGIN
    tier: send
    fields: [title, url, repo, number, author, references]
    state: [state, head_sha, checks, review_decision, mergeable]

  # Assigned to the person.
  - name: jira-assigned
    match:
      source: jira
      type: assigned
      addressed: true
    tier: send
    fields: [summary, url, key, project, issue_type, priority, actor]
    state: [status, assignee, resolution, due, priority]

  # A mention added to a field, not a comment. A comment that mentions the person is jira-comments-addressed.
  - name: jira-mentions
    match:
      source: jira
      type: mentioned
    tier: send
    fields: [summary, url, key, project, actor]
    state: [status, assignee, due]

  # A transition, by someone else, of an issue assigned to the person.
  - name: jira-transitions
    match:
      source: jira
      type: transitioned
      addressed: true
    tier: send
    fields: [summary, url, key, project, from_status, to_status, actor]
    state: [status, assignee, resolution, due, priority]

  # --- Google

  # Your own mail (the SENT label, never a From header), calendar responses and events your account
  # created, and your comments and resolves close your open asks on that thread. Your sent mail leaves
  # as its link and ids only: no subject, no addresses.
  - name: gmail-own-acts
    match: {source: gmail, own: true}
    tier: send
    fields: [link]

  - name: calendar-own-acts
    match: {source: calendar, own: true}
    tier: send
    fields: [summary, start, end, link, response]
    state: [status, start, end, response]

  - name: drive-own-acts
    match: {source: drive, own: true}
    tier: send
    fields: [title, link, file_type]
    state: [resolved, assignee]

  # Mail you starred: a to-do you set yourself.
  - name: gmail-starred
    match: {source: gmail, type: starred}
    tier: send
    ask: me
    priority: medium
    fields: [subject, from, date, link]
    state: [unread, starred, last_from]

  # Promotions, social, updates and forums are never sent.
  - name: gmail-bulk
    match:
      source: gmail
      fields:
        labels: {regex: ".*CATEGORY_(PROMOTIONS|SOCIAL|UPDATES|FORUMS).*"}
    tier: never

  # Other mail with you in To. Held: review what it would send before you change it to send.
  - name: gmail-addressed
    match:
      source: gmail
      type: received
      addressed: true
    tier: hold
    ask: me
    fields: [subject, from, date, link, actor]
    state: [unread, starred, last_from]

  # An invitation from someone else that you have not answered. due_at is the start.
  - name: calendar-response-needed
    match:
      source: calendar
      type: response_needed
    tier: send
    ask: me
    priority: medium
    fields: [summary, start, end, organizer, attendees, link, actor]
    state: [status, start, end, response]

  # An event on your calendar was created by someone else, changed or cancelled. Calendar does not say
  # who changed an event, so a change to an event you organise is here too, not an own act.
  - name: calendar-changes
    match:
      source: calendar
      type: {regex: "created|changed|cancelled"}
    tier: send
    fields: [summary, start, end, organizer, response, link, actor]
    state: [status, start, end, response]

  # The first run's events in the next 7 days.
  - name: calendar-upcoming
    match:
      source: calendar
      type: upcoming
    tier: send
    fields: [summary, start, end, organizer, response, link]
    state: [status, start, end, response]

  # A comment or reply assigned to you.
  - name: drive-assigned
    match:
      source: drive
      type: assigned
    tier: send
    ask: me
    priority: high
    fields: [title, link, file_type, author]
    state: [resolved, assignee]

  # A comment or reply that mentions you.
  - name: drive-mentioned
    match:
      source: drive
      type: mentioned
    tier: send
    ask: me
    priority: medium
    fields: [title, link, file_type, author]
    state: [resolved, assignee]

  # Notes by Gemini for a meeting you organised or accepted: a link, not the notes.
  - name: drive-meeting-notes
    match:
      source: drive
      type: notes_created
    tier: send
    fields: [title, link, meeting, meeting_start]

  # --- Slack

  # Your own messages close your open asks: a reply in the thread, or any top-level message in a
  # one-to-one direct message. They leave as a link only: no text, no channel name.
  - name: slack-own-messages
    match: {source: slack, own: true}
    tier: send
    fields: [permalink]

  # Apps and bots (an author id starting with B) are never sent, even in a direct message.
  - name: slack-bots
    match:
      source: slack
      fields:
        author: {glob: "B*"}
    tier: never

  # A direct message to you. Held, not sent, until Signal restricts slack:dm:*.
  - name: slack-direct-messages
    match: {source: slack, type: dm_received}
    tier: send
    ask: me
    priority: high
    fields: [channel, permalink, author, actor, references]

  # A message that mentions you, in a channel or a group direct message.
  - name: slack-mentions
    match: {source: slack, type: mentioned}
    tier: send
    ask: me
    priority: medium
    fields: [channel, permalink, author, actor, references]

  # Replies in threads you posted in (thread_reply) and review requests in your configured channels
  # (review_request) are not sent: add a rule for them once you have seen what they hold.

  - name: everything-else
    match: {}
    tier: never
