# Starter rules for GitHub, Jira, Gmail, Calendar, Drive and Slack. Copy this file, replace YOUR_LOGIN with
# your GitHub login, and point the config's rules key at it. Check it with: beacon rules check
#
# First match wins. An item no rule matches is never sent. Bodies are not listed: comment, review and
# mail text, event descriptions, meeting notes and Slack messages stay on the machine unless you add
# body to a rule, and Google sources do not even read them until a rule lists body. `title`,
# `summary` and `subject` are the object's title, used as the thread title. The event title
# describes the change (Opened, Reviewed: approved, Assigned to a name, New message, Response
# needed, Mentioned) and is not one of these fields.
#
# person.identities should name you as the token's user, or own acts are recorded as Beacon's:
#   github: github:user:<login>
#   jira: jira:account:<account id>
#   gmail, calendar, drive: email:<your address>
#   slack: slack:user:<your user id>
#
# Gmail, Calendar and Drive subjects are personal (gmail:<handle>:thread:…), and so are Slack direct
# messages (slack:dm:<handle>:…). Before mode: send, ask Signal's admin to restrict gmail:*,
# calendar:*, drive:* and slack:dm:*, or every reader can read them. Beacon holds them until then.
#
# A Jira rule below records the event and does not ask. Add ask: me to ask yourself.

rules:
  # The person's own acts close their open asks (DEC-19, DEC-20). First, so an own comment is not
  # also an ask to themselves. Split by source so each rule names only that source's fields.
  - name: github-own-acts
    match: {source: github, own: true}
    tier: send
    fields: [title, url, repo, number, actor, references]
    state: [state, checks, review_decision, author]

  - name: jira-own-acts
    match: {source: jira, own: true}
    tier: send
    fields: [summary, url, key, project, actor, references]
    state: [status, assignee, due]

  # A review request that names the person.
  - name: github-review-requests
    match:
      source: github
      type: review_requested
      addressed: true
    tier: send
    ask: me
    priority: high
    fields: [title, url, repo, number, author, actor, references]
    state: [state, draft, head_sha, review_decision, mergeable, checks, requested_reviewers, author]

  # A comment that mentions the person.
  - name: github-comments-addressed
    match:
      source: github
      type: commented
      addressed: true
    tier: send
    ask: me
    priority: high
    fields: [title, url, repo, number, author, actor, references]
    state: [state, checks, review_decision, author]

  - name: jira-comments-addressed
    match:
      source: jira
      type: commented
      addressed: true
    tier: send
    ask: me
    priority: high
    fields: [summary, url, key, project, actor, references]
    state: [status, assignee]

  # Someone else's review of a pull request the person wrote.
  - name: github-reviews-on-own
    match:
      source: github
      type: reviewed
      fields:
        author: YOUR_LOGIN
    tier: send
    fields: [title, url, repo, number, author, review_state, actor, references]
    state: [state, draft, head_sha, review_decision, mergeable, checks, author]

  # A merge of a pull request the person wrote, by someone else. Their own merge is an own act.
  - name: github-merges-on-own
    match:
      source: github
      type: merged
      fields:
        author: YOUR_LOGIN
    tier: send
    fields: [title, url, repo, number, author, actor, references]
    state: [state, head_sha, checks, author]

  # A check-suite conclusion on the person's own open pull request.
  - name: github-checks-on-own
    match:
      source: github
      type: checks_changed
      fields:
        author: YOUR_LOGIN
    tier: send
    fields: [title, url, repo, number, author, references]
    state: [state, head_sha, checks, review_decision, mergeable, author]

  # The pull request's state beside a merge, a close or a check conclusion that no rule above sent,
  # so Signal's snapshot says merged, closed, passing or failing. Asks nothing. Beacon does not send
  # it when the change itself was sent.
  - name: github-snapshots
    match: {source: github, type: snapshot}
    tier: send
    fields: [title, url, repo, number]
    state: [state, head_sha, checks, review_decision, mergeable, author]

  # Assigned to the person.
  - name: jira-assigned
    match:
      source: jira
      type: assigned
      addressed: true
    tier: send
    fields: [summary, url, key, project, issue_type, priority, actor]
    state: [status, assignee, resolution, due, priority]

  # A mention added to a field, not a comment. A comment that mentions the person is jira-comments-addressed.
  - name: jira-mentions
    match:
      source: jira
      type: mentioned
    tier: send
    fields: [summary, url, key, project, actor]
    state: [status, assignee, due]

  # A transition, by someone else, of an issue assigned to the person.
  - name: jira-transitions
    match:
      source: jira
      type: transitioned
      addressed: true
    tier: send
    fields: [summary, url, key, project, from_status, to_status, actor]
    state: [status, assignee, resolution, due, priority]

  # --- Google

  # Your own mail (the SENT label, never a From header), calendar responses and events your account
  # created, and your comments and resolves close your open asks on that thread. Your sent mail leaves
  # as its link and ids only: no subject, no addresses.
  - name: gmail-own-acts
    match: {source: gmail, own: true}
    tier: send
    fields: [link]

  - name: calendar-own-acts
    match: {source: calendar, own: true}
    tier: send
    fields: [title, summary, start, end, link, meet_link, response]
    state: [status, start, end, response, attendees, meet_link]

  - name: drive-own-acts
    match: {source: drive, own: true}
    tier: send
    fields: [title, link, file_type]
    state: [resolved, assignee]

  # Mail you starred: a to-do you set yourself.
  - name: gmail-starred
    match: {source: gmail, type: starred}
    tier: send
    ask: me
    priority: medium
    fields: [subject, from, date, link]
    state: [unread, starred, last_from]

  # A billing or account problem from a service your work runs on. Gmail files these under Updates,
  # so this comes before the bulk rule. Receipts do not match. Add the domains of the other services
  # you depend on.
  - name: gmail-service-alerts
    match:
      source: gmail
      type: received
      fields:
        from: {regex: '(?i)[^@]+@([a-z0-9-]+\.)*github\.com'}
        subject: {regex: '(?i).*\b(billing|payment (failed|declined)|failed payment|past due|overdue|suspended|locked|action required|problem)\b.*'}
    tier: send
    ask: me
    priority: high
    fields: [subject, from, date, link]
    state: [unread, starred, last_from]

  # Promotions, social, updates and forums are never sent.
  - name: gmail-bulk
    match:
      source: gmail
      fields:
        labels: {regex: ".*CATEGORY_(PROMOTIONS|SOCIAL|UPDATES|FORUMS).*"}
    tier: never

  # Other mail with you in To. Held: review what it would send before you change it to send.
  - name: gmail-addressed
    match:
      source: gmail
      type: received
      addressed: true
    tier: hold
    ask: me
    fields: [subject, from, date, link, actor]
    state: [unread, starred, last_from]

  # An invitation from someone else that you have not answered. due_at is the start.
  - name: calendar-response-needed
    match:
      source: calendar
      type: response_needed
    tier: send
    ask: me
    priority: medium
    fields: [title, summary, start, end, organizer, attendees, link, meet_link, actor]
    state: [status, start, end, response, attendees, meet_link]

  # An event on your calendar was created by someone else, changed or cancelled. Calendar does not say
  # who changed an event, so a change to an event you organise is here too, not an own act.
  - name: calendar-changes
    match:
      source: calendar
      type: {regex: "created|changed|cancelled"}
    tier: send
    fields: [title, summary, start, end, organizer, response, link, meet_link, actor]
    state: [status, start, end, response, attendees, meet_link]

  # The first run's events in the next 7 days.
  - name: calendar-upcoming
    match:
      source: calendar
      type: upcoming
    tier: send
    fields: [title, summary, start, end, organizer, response, link, meet_link]
    state: [status, start, end, response, attendees, meet_link]

  # The state of each meeting in the next 7 days, written as it enters that window and when its
  # state changes, so Signal can list your meetings in the next 24 hours. Asks nothing. Beacon does
  # not send it when the change beside it was sent.
  - name: calendar-snapshots
    match: {source: calendar, type: snapshot}
    tier: send
    fields: [title, start, end, response, link, meet_link]
    state: [status, start, end, response, attendees, meet_link]

  # A comment or reply assigned to you.
  - name: drive-assigned
    match:
      source: drive
      type: assigned
    tier: send
    ask: me
    priority: high
    fields: [title, link, file_type, author]
    state: [resolved, assignee]

  # A comment or reply that mentions you.
  - name: drive-mentioned
    match:
      source: drive
      type: mentioned
    tier: send
    ask: me
    priority: medium
    fields: [title, link, file_type, author]
    state: [resolved, assignee]

  # Notes by Gemini for a meeting you organised or accepted: a link, not the notes.
  - name: drive-meeting-notes
    match:
      source: drive
      type: notes_created
    tier: send
    fields: [title, link, meeting, meeting_start, references]

  # --- Slack

  # Slack's title is the conversation's, who and where, never what was said: "DM with Dana Scully",
  # "Group DM: Carol Danvers, Dana Scully", "#eng: Bob Ross mentioned you", "#eng thread", "You in
  # #eng", "You to Dana Scully". It names the thread in Signal. It needs the users:read and im:read
  # scopes; without them the thread is named by its first event ("Direct message", "Mentioned").
  # channel_name and author_name are the same names as fields of their own.

  # Your own messages close your open asks: a reply in the thread, or a top-level message in a
  # one-to-one direct message (it answers the earlier top-level messages there). They leave as a
  # link and the conversation's title: no text.
  - name: slack-own-messages
    match: {source: slack, own: true}
    tier: send
    fields: [title, permalink]

  # Apps and bots (an author id starting with B) are never sent, even in a direct message.
  - name: slack-bots
    match:
      source: slack
      fields:
        author: {glob: "B*"}
    tier: never

  # A message that asked you was deleted: close the ask it opened, and no other.
  - name: slack-deleted
    match: {source: slack, type: message_deleted}
    tier: send
    close_by_others: true

  # A one-to-one direct message to you. Direct messages, group direct messages and private
  # channels are personal (slack:dm:…): held, not sent, until Signal restricts slack:dm:*.
  - name: slack-direct-messages
    match:
      source: slack
      type: dm_received
      fields:
        channel_type: im
    tier: send
    ask: me
    priority: high
    fields: [title, channel, channel_type, permalink, author, actor, references]

  # A message in a group direct message you are in.
  - name: slack-group-messages
    match:
      source: slack
      type: dm_received
      fields:
        channel_type: mpim
    tier: send
    ask: me
    priority: medium
    fields: [title, channel, channel_type, permalink, author, actor]

  # A message that mentions you, or a user group you are in, or @here/@channel in a configured
  # channel. No references: links in a channel message are its content.
  - name: slack-mentions
    match: {source: slack, type: mentioned}
    tier: send
    ask: me
    priority: medium
    fields: [title, channel, channel_type, permalink, author, actor]

  # Replies in threads you posted in or were mentioned in (thread_reply) and review requests in
  # your configured channels (review_request) are not sent. To record thread replies without an
  # ask, and let someone else's reply close the mention in that thread, uncomment these once you
  # have seen what they hold (docs/sources.md, Slack, "Thread replies"):
  #
  # - name: slack-thread-replies
  #   match: {source: slack, type: thread_reply, fields: {channel_type: channel}}
  #   tier: send
  #   close_by_others: true
  #   fields: [title, channel, channel_type, permalink, author, actor]

  - name: everything-else
    match: {}
    tier: never
